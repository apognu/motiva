name: Build and test

on:
  workflow_call:
    inputs:
      minimal:
        description: Only build the feature combination with all features, instead of every combination
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/faster' }} # TODO: drop ci/faster before merging

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-cov
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/faster' }} # TODO: drop ci/faster before merging

      - name: Install the Python dependencies
        run: uv sync

      - name: Test
        run: cargo llvm-cov --locked --tests --lcov --output-path lcov.info

      - uses: coverallsapp/github-action@v2

  e2e:
    runs-on: ubuntu-26.04
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.3.2
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      yente-version: 5.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.98

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/faster' }} # TODO: drop ci/faster before merging

      - name: Install Yente
        run: |
          echo '{ "catalogs": [{ "resource_name": "entities.ftm.json", "scope": "eu_fsf", "url": "https://data.opensanctions.org/datasets/latest/index.json" }] }' > /tmp/manifest.json
          uv pip install --system yente==${{env.yente-version}}

      # Indexing runs in the background while the tests compile.
      - name: Index data and build E2E tests
        env:
          YENTE_INDEX_URL: http://localhost:9200
          YENTE_MANIFEST: /tmp/manifest.json
        run: |
          yente reindex &
          INDEXER=$!
          cargo test --locked --no-run
          wait $INDEXER

      - name: E2E tests
        run: cargo test --locked -- --include-ignored e2e
        env:
          INDEX_URL: http://localhost:9200

  generate-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Generate feature combinations
        id: generate
        run: |
          combinations=$(python .github/scripts/featuresets.py ${{ inputs.minimal && '--minimal' || '' }})
          echo "matrix=$combinations" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-26.04
    container: rust:1.98-trixie
    needs: [generate-matrix]
    strategy:
      matrix:
        combination: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release${{ matrix.combination.suffix }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/faster' }} # TODO: drop ci/faster before merging

      - name: Build
        run: cargo build --locked --release ${{ matrix.combination.features != '' && format('--features {0}', matrix.combination.features) || '' }}

      - name: Print version
        run: ./target/release/motiva version

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/motiva dist/motiva${{ matrix.combination.suffix }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: motiva${{ matrix.combination.suffix }}
          path: dist/motiva${{ matrix.combination.suffix }}
          retention-days: 7
