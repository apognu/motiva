name: Build and test

on:
  workflow_call:

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@1.98

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust-1.98-

      - name: Install the Python dependencies
        run: uv sync

      - name: Check
        run: cargo test --locked --all-features --no-run

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy, rustfmt

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust-1.98-

      - name: Lint
        run: cargo clippy --locked --all-features -- -D warnings

      - name: Format
        run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    needs: [check, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-llvm-cov
            nextest

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust-1.98-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libicu74 libicu-dev

      - name: Install the Python dependencies
        run: uv sync

      - name: Test
        run: cargo llvm-cov --locked --tests --lcov --output-path lcov.info

      - uses: coverallsapp/github-action@v2

  e2e:
    runs-on: ubuntu-latest
    needs: [check, lint]
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.3.2
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      yente-version: 5.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust-1.98-

      - name: Yente indexer
        env:
          YENTE_INDEX_URL: http://localhost:9200
          YENTE_MANIFEST: /tmp/manifest.json
        run: |
          echo '{ "catalogs": [{ "resource_name": "entities.ftm.json", "scope": "us_sanctions", "url": "https://data.opensanctions.org/datasets/latest/index.json" }] }' > /tmp/manifest.json
          uv pip install --system yente==${{env.yente-version}}
          yente reindex

      - name: E2E tests
        run: cargo test --locked -- --include-ignored e2e
        env:
          INDEX_URL: http://localhost:9200

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Generate feature combinations
        id: generate
        run: |
          combinations=$(python .github/scripts/featuresets.py)
          echo "matrix=$combinations" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: [check, lint, generate-matrix]
    strategy:
      matrix:
        combination: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@1.98

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust-1.98-

      - name: Build
        run: cargo build --locked --release ${{ matrix.combination.features != '' && format('--features {0}', matrix.combination.features) || '' }}

      - name: Print version
        run: ./target/release/motiva version

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/motiva dist/motiva${{ matrix.combination.suffix }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: motiva${{ matrix.combination.suffix }}
          path: dist/motiva${{ matrix.combination.suffix }}
          retention-days: 7
