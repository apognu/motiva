name: Publish to Docker Hub

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      push:
        type: boolean
        required: true
      minimal:
        description: Only build the feature combination with all features, instead of every combination
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  generate-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Generate feature combinations
        id: generate
        run: |
          combinations=$(python .github/scripts/featuresets.py ${{ inputs.minimal && '--minimal' || '' }})
          echo "matrix=$combinations" >> $GITHUB_OUTPUT

  docker:
    runs-on: ubuntu-26.04
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        combination: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: docker/features/${{ matrix.combination.features || 'base' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: motiva${{ matrix.combination.suffix }}
          path: dist

      - name: Stage binary
        run: |
          mv dist/motiva${{ matrix.combination.suffix }} tmp && mv tmp dist/motiva
          chmod +x dist/motiva

      - name: Check binary runs in the runtime image
        run: docker run --rm -v "$PWD/dist:/dist:ro" --entrypoint /dist/motiva gcr.io/distroless/cc-debian13 version

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          annotations: |
            org.opencontainers.image.description=Sanctions, PEP and adverse media screening API
          labels: |
            org.opencontainers.image.description=Sanctions, PEP and adverse media screening API

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: |
            apognu/motiva:${{ inputs.tag }}${{ matrix.combination.suffix }}
            ghcr.io/apognu/motiva:${{ inputs.tag }}${{ matrix.combination.suffix }}
          build-args: |
            BINARY_SOURCE=prebuilt
          push: ${{ inputs.push }}
          provenance: mode=max

      - name: Attest GHCR
        uses: actions/attest@v4
        if: ${{ inputs.push }}
        with:
          subject-name: ghcr.io/apognu/motiva
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest GH
        uses: actions/attest@v4
        if: ${{ inputs.push }}
        with:
          subject-name: docker.io/apognu/motiva
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
